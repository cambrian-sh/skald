name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/checkout@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: afsin-asf/codebase-memory-mcp
          ref: cf1d310a72320ec55e7b86a091561162567e55d2
          path: .release/afsin-engine
          fetch-depth: 1
      - name: Build pinned Afşin engine for standalone smoke build
        if: matrix.os == 'ubuntu-latest'
        working-directory: .release/afsin-engine
        run: scripts/build.sh
      - name: Stage pinned Afşin engine for standalone smoke build
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run stage:engine -- \
            --binary .release/afsin-engine/build/c/codebase-memory-mcp \
            --platform linux \
            --arch amd64
      - run: bun run build
        if: matrix.os == 'ubuntu-latest'
