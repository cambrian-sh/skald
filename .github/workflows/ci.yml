name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Extract pinned Afşin source snapshot
        if: matrix.os == 'ubuntu-latest'
        run: bun run extract:engine-source -- --destination .release/afsin-engine
      - name: Build pinned Afşin engine for standalone smoke build
        if: matrix.os == 'ubuntu-latest'
        working-directory: .release/afsin-engine
        run: scripts/build.sh
      - name: Stage pinned Afşin engine for standalone smoke build
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run stage:engine -- \
            --binary .release/afsin-engine/build/c/codebase-memory-mcp \
            --platform linux \
            --arch amd64
      - run: bun run build
        if: matrix.os == 'ubuntu-latest'
      - name: Verify standalone setup adopts the Afşin engine and Cambrian knowledge
        if: matrix.os == 'ubuntu-latest'
        env:
          SKALD_TEST_STANDALONE_CLI: ${{ github.workspace }}/dist/skald
        run: >-
          bun test --isolate
          --test-name-pattern "preserves Cambrian knowledge when setup replaces an existing absolute engine"
          test/cli.test.ts
