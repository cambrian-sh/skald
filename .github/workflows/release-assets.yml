name: Release assets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            build_arch: ""
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            build_arch: ""
          - os: macos-14
            platform: darwin
            arch: arm64
            build_arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            build_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: afsin-asf/codebase-memory-mcp
          ref: cf1d310a72320ec55e7b86a091561162567e55d2
          path: .release/afsin-engine
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build Afşin engine
        working-directory: .release/afsin-engine
        shell: bash
        run: |
          if [ -n "${{ matrix.build_arch }}" ]; then
            scripts/build.sh --arch "${{ matrix.build_arch }}"
          else
            scripts/build.sh
          fi
      - run: bun install --frozen-lockfile
      - name: Stage pinned engine
        run: |
          bun run stage:engine -- \
            --binary .release/afsin-engine/build/c/codebase-memory-mcp \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"
      - run: bun run build
      - name: Package the matching native engine
        run: |
          bun run package:release -- \
            --binary "vendor/engine/${{ matrix.platform }}-${{ matrix.arch }}/codebase-memory-mcp" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --output .release/packages
      - run: ./dist/skald --version
      - uses: actions/upload-artifact@v4
        with:
          name: skald-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/skald
            dist/skald.sha256
            vendor/engine/manifest.json
            vendor/engine/AFSIN-LICENSE
            .release/packages/*.tgz
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/skald
            .release/packages/*.tgz
